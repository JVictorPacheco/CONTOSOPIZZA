version: '3.8'

services:
  # ============================================
  # PostgreSQL - Banco de dados
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: contosopizza-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: contosopizza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - contosopizza-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # PgAdmin - Interface web para PostgreSQL
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: contosopizza-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@contosopizza.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - contosopizza-network

  # ============================================
  # API .NET 9 - Sua aplicação
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contosopizza-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=contosopizza;Username=postgres;Password=postgres123
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - contosopizza-network

# ============================================
# Volumes (persistência de dados)
# ============================================
volumes:
  postgres_data:
    driver: local

# ============================================
# Networks (comunicação entre containers)
# ============================================
networks:
  contosopizza-network:
    driver: bridge